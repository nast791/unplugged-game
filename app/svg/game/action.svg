<!-- Объёмный пузырёк счёта действий: тело с градиентом и блик сверху — без рамки, как сердце. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="actionBody" x1="0.1" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#9bf3ff" />
      <stop offset="0.42" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#0b6b82" />
    </linearGradient>
    <radialGradient id="actionGloss" cx="0.34" cy="0.26" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="12" cy="12" r="10.2" fill="url(#actionBody)" />
  <circle cx="12" cy="12" r="10.2" fill="url(#actionGloss)" />
</svg>
